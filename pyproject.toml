[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: "quirewright" is a placeholder name. See src/quirewright/__init__.py (APP_NAME).
name = "quirewright"
version = "0.1.0"
description = "Quirewright: a free and open-source PDF editor combining vector object editing with page management, forms, comments and signatures."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pymupdf>=1.24",
    "pyhanko>=0.25",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://quirewright.github.io/quirewright/"
Source = "https://github.com/quirewright/quirewright"
Issues = "https://github.com/quirewright/quirewright/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.5", "markdown>=3.5"]
build = ["pyinstaller>=6"]

[project.scripts]
quirewright = "quirewright.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quirewright = ["assets/*.svg", "help/*.md", "help/*.png", "locale/*.pot", "locale/*/LC_MESSAGES/*.po", "locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
